[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adk-ranking-agent"
version = "0.1.0"
description = "Google ADK agent with Chrome ranking evidence and durable jobs"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.0,<3", "playwright>=1.50,<2", "pydantic>=2,<3",
  "python-dotenv>=1,<2", "sqlalchemy>=2,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "psycopg[binary]>=3,<4", "litellm>=1.84,<2",
  "serpapi>=0.1,<1", "apscheduler>=3.10,<4"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1"]
storage = ["boto3>=1.34,<2"]

[project.scripts]
rank-agent = "ranking_agent.cli:main"

[tool.setuptools.packages.find]
include = ["ranking_agent*"]

[tool.setuptools.package-data]
ranking_agent = ["extract.js", "fixtures/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

